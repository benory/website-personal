<script>
(() => {
  const normalize = (value) => String(value == null ? "" : value).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("en");
  const dateFormatter = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  const monthFormatter = new Intl.DateTimeFormat("en-GB", { month: "long", year: "numeric", timeZone: "UTC" });

  function formatDate(value) {
    const [year, month, day] = String(value).split("-").map(Number);
    if (!year) return "";
    if (!month) return String(year);
    const date = new Date(Date.UTC(year, month - 1, day || 1));
    return (day ? dateFormatter : monthFormatter).format(date);
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function cell(row, className) {
    const node = element("td", className);
    node.setAttribute("role", "cell");
    row.append(node);
    return node;
  }

  function makeRow(entry, formattedDate) {
    const row = element("tr");
    row.setAttribute("role", "row");
    const dateCell = cell(row, "correspondence-date-cell");
    dateCell.append(element("p", "correspondence-date", formattedDate));
    const address = entry["Carapetyan Address"] || "";
    const country = entry["Carapetyan Country"] || "";
    if (address || country) {
      const addressText = address && country ? `${address} (${country})` : address || country;
      const addressNode = element("p", "correspondence-address");
      addressNode.append(element("span", "correspondence-address-label", "Carapetyan’s address:"), document.createTextNode(addressText));
      dateCell.append(addressNode);
    }

    const people = cell(row, "correspondence-people");
    people.append(
      element("span", "correspondence-sender-name", entry.Sender),
      element("span", "correspondence-direction", " to "),
      element("span", "correspondence-recipient-name", entry.Recipient)
    );

    const summary = cell(row, "correspondence-summary");
    const summaryLabel = element("span", "correspondence-mobile-label", "Substance of correspondence");
    summaryLabel.setAttribute("aria-hidden", "true");
    summary.append(summaryLabel, element("p", "correspondence-summary-text", entry["Substance of Correspondence"]));

    const reference = cell(row, "correspondence-reference");
    const referenceLabel = element("span", "correspondence-mobile-label", "Archival reference");
    referenceLabel.setAttribute("aria-hidden", "true");
    reference.append(
      referenceLabel,
      element("span", "correspondence-archive", entry.Archive),
      element("span", "correspondence-signature", entry["Archival Signature"])
    );
    return row;
  }

  window.initializeCorrespondenceCatalogue = (data) => {
    const form = document.querySelector(".correspondence-controls");
    if (!form) return;
    const search = document.getElementById("correspondence-search");
    const sender = document.getElementById("correspondence-sender");
    const recipient = document.getElementById("correspondence-recipient");
    const year = document.getElementById("correspondence-year");
    const clear = document.getElementById("correspondence-clear");
    const count = document.getElementById("correspondence-count");
    const entries = document.getElementById("correspondence-entries");
    const table = document.querySelector(".correspondence-table");
    const empty = document.getElementById("correspondence-empty");

    function populate(select, field) {
      const values = [...new Set(data.map((entry) => entry[field]).filter(Boolean))];
      values.sort((a, b) => String(a).localeCompare(String(b), "en", { numeric: true, sensitivity: "base" }));
      values.forEach((value) => {
        const option = element("option", "", value);
        option.value = value;
        select.append(option);
      });
    }
    populate(sender, "Sender");
    populate(recipient, "Recipient");
    populate(year, "Year");

    const records = data.map((entry) => {
      const date = formatDate(entry.Date);
      return {
        entry,
        row: makeRow(entry, date),
        searchText: normalize([...Object.values(entry), date, `${entry.Sender} to ${entry.Recipient}`].join(" "))
      };
    });

    function filter() {
      const words = normalize(search.value).trim().split(/\s+/).filter(Boolean);
      const matches = records.filter(({ entry, searchText }) =>
        (!sender.value || entry.Sender === sender.value) &&
        (!recipient.value || entry.Recipient === recipient.value) &&
        (!year.value || String(entry.Year) === year.value) &&
        words.every((word) => searchText.includes(word))
      );
      const fragment = document.createDocumentFragment();
      matches.forEach(({ row }) => fragment.append(row));
      entries.replaceChildren(fragment);
      count.textContent = `${matches.length.toLocaleString("en")} ${matches.length === 1 ? "entry" : "entries"}`;
      clear.disabled = !(words.length || sender.value || recipient.value || year.value);
      table.hidden = matches.length === 0;
      empty.hidden = matches.length > 0;
    }

    function reset() {
      form.reset();
      filter();
      search.focus();
    }

    form.addEventListener("submit", (event) => { event.preventDefault(); filter(); });
    search.addEventListener("input", filter);
    [sender, recipient, year].forEach((select) => select.addEventListener("change", filter));
    clear.addEventListener("click", reset);
    document.getElementById("correspondence-empty-clear").addEventListener("click", reset);
    filter();
  };
})();
</script>
