<script>
  window.initializeArchiveCatalogue = function (metadata) {
    const search = document.getElementById("archive-search");
    const collection = document.getElementById("archive-collection");
    const access = document.getElementById("archive-access");
    const clear = document.getElementById("archive-clear");
    const results = document.getElementById("archive-results");
    const count = document.getElementById("archive-count");
    const empty = document.getElementById("archive-empty");

    const normalize = (value) => String(value || "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase();

    const plainText = (value) => String(value || "").replace(/<\/?i>/gi, "");

    const onlineUrl = (entry) => {
      const available = normalize(entry["Image Available"]).trim() === "yes";
      const cleared = normalize(entry.Copyright).trim() === "no" || normalize(entry.Permissions).trim() === "yes";
      if (!available || !cleared) return "";

      try {
        const url = new URL(entry.URL);
        return ["https:", "http:"].includes(url.protocol) ? url.href : "";
      } catch (error) {
        return "";
      }
    };

    const entries = metadata.filter((entry) => entry.Hidden === "no").map((entry) => ({
      record: entry,
      url: onlineUrl(entry),
      searchText: normalize(plainText([
        entry["Series Description"], entry["Folder Description"],
        `Series ${entry.Series}`, `Folder ${entry.Folder}`
      ].join(" ")))
    }));

    const collections = new Map();
    entries.forEach((entry) => {
      const name = entry.record["Series Description"];
      collections.set(name, (collections.get(name) || 0) + 1);
    });
    [...collections.keys()].sort((a, b) => plainText(a).localeCompare(plainText(b))).forEach((name) => {
      collection.add(new Option(plainText(name), name));
    });

    const element = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) {
        const value = String(text);
        let start = 0;
        for (const match of value.matchAll(/<i>([\s\S]*?)<\/i>/gi)) {
          node.append(document.createTextNode(value.slice(start, match.index)));
          const italic = document.createElement("i");
          italic.textContent = match[1];
          node.append(italic);
          start = match.index + match[0].length;
        }
        node.append(document.createTextNode(value.slice(start)));
      }
      return node;
    };

    const renderEntry = (entry) => {
      const record = entry.record;
      const item = element("li", "archive-entry");
      const content = element("div", "archive-entry-content");
      const description = String(record["Folder Description"] || "");
      const punctuation = [...description.matchAll(/<i>[\s\S]*?<\/i>|[:;]/gi)]
        .filter((match) => match[0].length === 1);
      const colonMatch = punctuation.find((match) => match[0] === ":");
      const colon = colonMatch ? colonMatch.index : -1;
      const separators = punctuation.filter((match) => match[0] === ";" && match.index > colon);
      const hasContents = colon > -1 && separators.length > 0;

      content.append(element("p", "archive-entry-title", hasContents ? description.slice(0, colon + 1) : description));
      const reference = element("p", "archive-reference", `Series ${record.Series} · Folder ${record.Folder}`);

      if (hasContents) {
        let start = colon + 1;
        const parts = [...separators, { index: description.length }].map(({ index }) => {
          const part = description.slice(start, index).trim();
          start = index + 1;
          return part;
        }).filter(Boolean);
        const list = element("ul", "archive-entry-contents");
        parts.forEach((part) => list.append(element("li", "", part)));
        content.append(list);
      }

      const availability = element("div", "archive-access");
      if (entry.url) {
        const link = element("a", "", "View scan ↗");
        link.href = entry.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", `View scan: ${plainText(description)} (opens in a new tab)`);
        availability.append(link);
      }
      item.append(reference, content);
      if (entry.url) item.append(availability);
      return item;
    };

    const render = () => {
      const terms = normalize(search.value).trim().split(/\s+/).filter(Boolean);
      const filtered = entries.filter((entry) =>
        terms.every((term) => entry.searchText.includes(term)) &&
        (!collection.value || entry.record["Series Description"] === collection.value) &&
        (!access.value || (access.value === "online" ? Boolean(entry.url) : !entry.url))
      );

      const groups = new Map();
      filtered.forEach((entry) => {
        const name = entry.record["Series Description"];
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(entry);
      });

      const fragment = document.createDocumentFragment();
      let groupIndex = 0;
      groups.forEach((groupEntries, name) => {
        const group = element("section", "archive-collection");
        const headingId = `archive-collection-${groupIndex++}`;
        group.setAttribute("aria-labelledby", headingId);
        const header = element("header", "archive-collection-header");
        const heading = element("div");
        heading.append(element("p", "archive-series", `Series ${groupEntries[0].record.Series}`));
        const title = element("h2", "", name);
        title.id = headingId;
        heading.append(title);
        header.append(heading);
        const list = element("ol", "archive-entries");
        groupEntries.forEach((entry) => list.append(renderEntry(entry)));
        group.append(header, list);
        fragment.append(group);
      });

      results.replaceChildren(fragment);
      const isFiltered = Boolean(search.value.trim() || collection.value || access.value);
      count.textContent = isFiltered
        ? `${filtered.length} matching ${filtered.length === 1 ? "entry" : "entries"}`
        : "";
      clear.disabled = !isFiltered;
      empty.hidden = filtered.length !== 0;
    };

    const reset = () => {
      search.value = "";
      collection.value = "";
      access.value = "";
      render();
      search.focus();
    };

    document.querySelector(".archive-controls").addEventListener("submit", (event) => event.preventDefault());
    search.addEventListener("input", render);
    collection.addEventListener("change", render);
    access.addEventListener("change", render);
    clear.addEventListener("click", reset);
    document.getElementById("archive-empty-clear").addEventListener("click", reset);
    render();
  };
</script>
