<style>

  }

  .archive-header {
    margin-bottom: 20px;
  }

  }

  .archive-intro p { margin: 0 0 16px; }
  .archive-intro p:last-child { margin-bottom: 0; }

    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 0.85fr) auto;
    align-items: end;
    gap: 18px;
    border-block: 1px solid var(--modern-line);
    padding: 18px 0;
  }

  .archive-field label { font-size: 14px; font-weight: 500; }

  .archive-field input,
  .archive-field select {
    width: 100%;
    min-width: 0;
    height: 46px;
    border: 1px solid var(--modern-line-strong);
    border-radius: 6px;
    padding: 10px 12px;
    background-color: var(--modern-surface);
    color: var(--modern-soft-ink);
    font: inherit;
    font-size: 16px;
  }

  .archive-field input {
    padding-left: 38px;
    background-image: url("{{ '/assets/img/searchicon.png' | relative_url }}");
    background-repeat: no-repeat;
    background-position: 13px center;
    background-size: 14px;
  }

  .archive-field input::placeholder { color: var(--modern-muted); opacity: 1; }

  .archive-controls button,
  .archive-empty button {
    min-height: 46px;
    border: 0;
    border-radius: 4px;
    padding: 10px 0;
    background: transparent;
    color: var(--modern-accent);
    font: inherit;
    font-size: 15px;
    white-space: nowrap;
    cursor: pointer;
  }

  .archive-controls button:hover,
  .archive-empty button:hover {
    color: var(--modern-accent-dark);

    text-underline-offset: 0.2em;
  }

    color: var(--modern-muted);
    opacity: 0.65;
    cursor: default;
    text-decoration: none;
  }

  }

    width: 1px;
    height: 1px;

    border: 0;
  }

  }

    color: var(--modern-ink);

  }

    border-bottom: 1px solid var(--modern-line);
    padding: 10px 14px;

    max-width: none;
    margin: 0;
    color: var(--modern-soft-ink);
    font-size: calc(0.9375rem + var(--modern-growth));

    overflow-wrap: anywhere;

    list-style: none;

    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .archive-empty { border-bottom: 1px solid var(--modern-line); padding: 40px 0 48px; }

  @media (max-width: 900px) {

  @media (max-width: 640px) {
    .archive-page { padding: 42px 0 64px; }
    .archive-header h1 { margin-bottom: 14px; font-size: 36px; }
    .archive-intro { font-size: 16px; }
    .archive-controls { gap: 16px 12px; padding: 20px 0; }
    .archive-search-field { grid-column: 1 / -1; }
    .archive-controls button { min-height: 32px; padding: 0; }

    .archive-collection-header > div { display: block; }

    .archive-entry-content { grid-column: 1 / -1; grid-row: 1; }
