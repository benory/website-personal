<style>
  body.modern-home-body {
    --modern-paper: #ffffff;
    --modern-surface: #ffffff;
    --modern-ink: #101317;
    --modern-soft-ink: #2d343b;
    --modern-muted: #68727d;
    --modern-line: #d5dde3;
    --modern-line-strong: #bcc8d1;
    --modern-accent: #3b6f94;
    --modern-accent-dark: #285472;
    --modern-green: #286d5c;
    --modern-blue: #263f63;
    --modern-slate: #4f6672;
    --modern-navigation-ink: var(--modern-accent);
    --modern-navigation-active: var(--modern-accent-dark);
    --modern-navigation-font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --modern-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --modern-serif: Georgia, "Times New Roman", Times, serif;

    /* Preserve the laptop baseline through 80rem, then grow gradually to 120rem. */
    --modern-growth: clamp(0rem, calc(0.3125vw - 0.25rem), 0.125rem);
    --modern-content-width: calc(67.5rem + var(--modern-growth) * 140);
    --modern-header-height: calc(4.25rem + var(--modern-growth) * 4);
    --modern-body-size: calc(1rem + var(--modern-growth));

    margin: 0;
    background: var(--modern-paper);
    color: var(--modern-ink);
    font-family: var(--modern-sans);
    font-size: var(--modern-body-size);
    line-height: 1.58;
  }

  body.modern-home-body * {
    box-sizing: border-box;
  }

  body.modern-home-body a {
    color: var(--modern-accent);
    text-decoration-color: rgba(59, 111, 148, 0.32);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }

  body.modern-home-body a:hover {
    color: var(--modern-accent-dark);
    text-decoration-color: currentColor;
  }

  body.modern-home-body img {
    display: block;
    max-width: 100%;
  }

  .modern-wrap {
    width: min(var(--modern-content-width), calc(100% - 44px));
    margin: 0 auto;
  }

  .modern-site-header {
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid rgba(220, 227, 232, 0.9);
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .modern-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    min-height: var(--modern-header-height);
  }

  .modern-site-header .modern-brand {
    color: var(--modern-ink);
    font-family: var(--modern-serif);
    font-size: calc(1.75rem + var(--modern-growth) * 2);
    font-weight: 500;
    text-decoration: none;
  }

  .modern-site-header .modern-brand:hover,
  .modern-site-header .modern-brand:focus-visible {
    color: var(--modern-ink);
    text-decoration: none;
  }

  .modern-links {
    display: flex;
    align-items: center;
    gap: calc(2.1875rem + var(--modern-growth) * 4);
    font-family: var(--modern-navigation-font);
    font-size: calc(1.125rem + var(--modern-growth));
  }

  .modern-site-header .modern-links a {
    padding: 8px 0;
    color: var(--modern-navigation-ink);
    text-decoration: none;
  }

  .modern-site-header .modern-links a:hover,
  .modern-site-header .modern-links a:focus-visible,
  .modern-site-header .modern-links a[aria-current] {
    color: var(--modern-navigation-active);
    text-decoration: underline;
    text-decoration-color: currentColor;
    text-decoration-thickness: 1px;
    text-underline-offset: 7px;
  }

  .modern-home h1,
  .modern-home h2,
  .modern-home h3 {
    font-family: var(--modern-serif);
    font-weight: 500;
  }

  .modern-home .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, calc(20.625rem + var(--modern-growth) * 35));
    gap: calc(4.5rem + var(--modern-growth) * 8);
    align-items: center;
    min-height: calc(100vh - var(--modern-header-height));
    padding: calc(4.625rem + var(--modern-growth) * 8) 0 calc(5.125rem + var(--modern-growth) * 8);
  }

  .modern-home .hero h1 {
    max-width: 100%;
    margin: 0;
    color: var(--modern-ink);
    font-size: calc(4.25rem + var(--modern-growth) * 6);
    line-height: 1;
  }

  .modern-home .bio {
    max-width: calc(40rem + var(--modern-growth) * 40);
    margin: calc(1.625rem + var(--modern-growth) * 2) 0 0;
    color: var(--modern-soft-ink);
    font-size: calc(1.0625rem + var(--modern-growth));
  }

  .modern-home .bio p {
    margin: 0 0 calc(1rem + var(--modern-growth));
  }

  .modern-home .bio p:last-child {
    margin-bottom: 0;
  }

  .modern-home .quick-links {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: calc(0.75rem + var(--modern-growth));
    row-gap: 4px;
    margin-top: calc(2rem + var(--modern-growth) * 3);
  }

  .modern-home .slash {
    color: #d2d2d7;
    font-weight: 400;
    pointer-events: none;
  }

  .modern-home .quiet-link {
    display: inline-flex;
    align-items: center;
    color: var(--modern-accent);
    font-size: calc(0.9375rem + var(--modern-growth));
    font-weight: 650;
    text-decoration: none;
  }

  .modern-home .quiet-link:hover {
    color: var(--modern-accent-dark);
  }

  .modern-home .quick-links .quiet-link {
    color: var(--modern-navigation-ink);
    font-family: var(--modern-navigation-font);
    font-size: 0.9375rem;
    font-weight: 500;
  }

  .modern-home .quick-links .quiet-link:hover,
  .modern-home .quick-links .quiet-link:focus-visible {
    color: var(--modern-navigation-active);
    text-decoration: underline;
    text-decoration-color: currentColor;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.22em;
  }

  .modern-home .portrait {
    align-self: center;
  }

  .modern-home .portrait-frame {
    border: 1px solid var(--modern-line);
    border-radius: 8px;
    background: var(--modern-surface);
    padding: 6px;
  }

  .modern-home .portrait img {
    width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 4px;
    object-fit: cover;
    object-position: center top;
  }

  .modern-home .section {
    padding: calc(4.5rem + var(--modern-growth) * 8) 0;
    scroll-margin-top: calc(var(--modern-header-height) + 18px);
  }

  .modern-home .section + .section {
    border-top: 1px solid var(--modern-line);
  }

  .modern-home .section-head {
    margin-bottom: calc(2.25rem + var(--modern-growth) * 3);
  }

  .modern-home .section-head h2 {
    margin: 0;
    color: var(--modern-ink);
    font-size: calc(2.75rem + var(--modern-growth) * 3);
    line-height: 1.08;
  }

  .modern-home .research-list,
  .modern-home .publication-list,
  .modern-home .news-list {
    display: grid;
    gap: 0;
    border-top: 1px solid var(--modern-line);
  }

  .modern-home .research-item {
    display: grid;
    grid-template-columns: minmax(0, calc(13.125rem + var(--modern-growth) * 22.5)) minmax(0, 1fr);
    gap: calc(2.125rem + var(--modern-growth) * 4);
    padding: calc(1.75rem + var(--modern-growth) * 4) 0;
    border-bottom: 1px solid var(--modern-line);
  }

  .modern-home .research-list .research-item:last-child {
    border-bottom: 0;
  }

  .modern-home .research-thumb {
    overflow: hidden;
    align-self: start;
    border: 1px solid var(--modern-line);
    border-radius: 8px;
    background: var(--modern-surface);
  }

  .modern-home .research-thumb img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }

  .modern-home .research-thumb.program-thumb {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 4 / 3;
    padding: 10px;
    background: #050505;
  }

  .modern-home .research-thumb.program-thumb img {
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    object-fit: contain;
    object-position: center;
  }

  .modern-home .research-copy {
    display: grid;
    grid-template-columns: minmax(0, 1fr) calc(8.625rem + var(--modern-growth) * 10);
    gap: calc(1.75rem + var(--modern-growth) * 4);
  }

  .modern-home .research-copy-wide {
    grid-template-columns: minmax(0, 1fr);
  }

  .modern-home .tag {
    display: inline-block;
    margin-bottom: 9px;
    color: var(--modern-blue);
    font-size: calc(0.8125rem + var(--modern-growth));
    font-weight: 700;
    text-transform: uppercase;
  }

  .modern-home .research-item:nth-child(2) .tag {
    color: var(--modern-green);
  }

  .modern-home .research-item:nth-child(3) .tag {
    color: var(--modern-accent);
  }

  .modern-home .research-item:nth-child(4) .tag {
    color: var(--modern-slate);
  }

  .modern-home .research-copy h3 {
    margin: 0;
    color: var(--modern-ink);
    font-size: calc(1.8125rem + var(--modern-growth) * 2);
    line-height: 1.15;
  }

  .modern-home .research-copy p {
    max-width: 40.625em;
    margin: 12px 0 0;
    color: var(--modern-soft-ink);
    font-size: var(--modern-body-size);
  }

  .modern-home .research-subentries {
    display: grid;
    gap: 14px;
    margin-top: 20px;
  }

  .modern-home .research-subentry {
    display: grid;
    grid-template-columns: minmax(0, 1fr) calc(8.625rem + var(--modern-growth) * 10);
    gap: calc(1.75rem + var(--modern-growth) * 4);
    align-items: start;
    border-top: 1px solid var(--modern-line);
    padding-top: 14px;
  }

  .modern-home .research-subentry h4 {
    margin: 0;
    color: var(--modern-ink);
    font-family: var(--modern-sans);
    font-size: var(--modern-body-size);
    font-weight: 650;
  }

  .modern-home .research-subentry p {
    margin-top: 6px;
  }

  .modern-home .subentry-links,
  .modern-home .item-links {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding-top: 32px;
  }

  .modern-home .subentry-links a,
  .modern-home .item-links a {
    font-size: calc(0.875rem + var(--modern-growth));
    font-weight: 650;
    text-decoration: none;
  }

  .modern-home .publication-entry {
    display: grid;
    grid-template-columns: minmax(0, calc(5.375rem + var(--modern-growth) * 6)) minmax(0, 1fr);
    gap: calc(1.25rem + var(--modern-growth) * 2);
    padding: calc(1rem + var(--modern-growth) * 2) 0;
    border-bottom: 1px solid var(--modern-line);
  }

  /* Jekyll Scholar adds a semantic list around the entries. Neutralize that
     wrapper so the bibliography retains the homepage's existing layout. */
  .modern-home .publication-list > .bibliography {
    display: contents;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .modern-home .publication-list > .bibliography > li {
    display: contents;
  }

  .modern-home .publication-entry img {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--modern-line);
    border-radius: 8px;
    background: var(--modern-surface);
    object-fit: cover;
  }

  .modern-home .pub-year {
    display: inline-block;
    margin-bottom: 5px;
    color: var(--modern-green);
    font-size: calc(0.8125rem + var(--modern-growth));
    font-weight: 700;
    text-transform: uppercase;
  }

  .modern-home .bibliography > li:nth-child(2n) .pub-year {
    color: var(--modern-blue);
  }

  .modern-home .bibliography > li:nth-child(3n) .pub-year {
    color: var(--modern-accent);
  }

  .modern-home .publication-entry p {
    margin: 0;
  }

  .modern-home .publication-content {
    display: grid;
    grid-template-columns: minmax(0, 1fr) calc(15.375rem + var(--modern-growth) * 12);
    gap: 18px;
    align-items: start;
  }

  .modern-home .pub-citation {
    color: var(--modern-soft-ink);
    font-size: calc(0.9375rem + var(--modern-growth));
  }

  .modern-home .pub-title {
    color: var(--modern-ink);
    font-weight: 400;
  }

  .modern-home .pub-links {
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 22px;
  }

  .modern-home .pub-links a,
  .modern-home .pub-links button {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    border: 1px solid var(--modern-line-strong);
    border-radius: 999px;
    padding: 3px 10px;
    background: rgba(255, 255, 255, 0.58);
    color: var(--modern-soft-ink);
    font: inherit;
    font-size: calc(0.8125rem + var(--modern-growth));
    font-weight: 650;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
  }

  .modern-home .pub-links button {
    cursor: pointer;
  }

  .modern-home .pub-links a:hover,
  .modern-home .pub-links button:hover {
    border-color: var(--modern-accent);
    color: var(--modern-accent);
  }

  .modern-home .abstract-panel {
    grid-column: 1 / 2;
    max-width: 780px;
    margin-top: -2px;
  }

  .modern-home .abstract-panel p {
    margin: 0;
    border-left: 2px solid var(--modern-line-strong);
    padding: 0 0 0 16px;
    color: var(--modern-muted);
    font-size: calc(0.9375rem + var(--modern-growth));
  }

  .modern-home .abstract-panel[hidden] {
    display: none;
  }

  .modern-home .news-item {
    display: grid;
    grid-template-columns: calc(6.5rem + var(--modern-growth) * 6) minmax(0, 1fr);
    gap: calc(1.625rem + var(--modern-growth) * 2);
    padding: 16px 0;
    border-bottom: 1px solid var(--modern-line);
  }

  .modern-home .news-item time {
    color: var(--modern-muted);
    font-size: calc(0.875rem + var(--modern-growth));
  }

  .modern-home .news-item p {
    margin: 0;
    color: var(--modern-soft-ink);
  }

  .modern-home .news-copy p + p {
    margin-top: 12px;
  }

  .modern-home .news-copy br {
    display: none;
  }

  .modern-footer {
    padding: 42px 0 52px;
    color: var(--modern-muted);
    font-size: calc(0.875rem + var(--modern-growth));
  }

  .modern-footer-inner {
    display: flex;
    justify-content: space-between;
    gap: 22px;
    border-top: 1px solid var(--modern-line);
    padding-top: 22px;
  }

  .modern-footer a {
    color: var(--modern-muted);
    text-decoration: none;
  }

  .modern-footer a:hover {
    color: var(--modern-accent);
  }

  @media (min-width: 901px) {
    .modern-home .quick-links .quiet-link {
      font-size: calc(1.25rem + var(--modern-growth));
    }
  }

  @media (max-width: 900px) {
    .modern-links {
      gap: 24px;
      font-size: 17px;
    }

    .modern-home .hero {
      grid-template-columns: 1fr;
      gap: 34px;
      min-height: auto;
      padding-top: 56px;
    }

    .modern-home .portrait {
      max-width: 330px;
    }

    .modern-home .publication-content {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .modern-home .abstract-panel {
      grid-column: 1 / -1;
    }

    .modern-home .pub-links {
      justify-content: flex-start;
      margin-top: 0;
    }

    .modern-home .research-copy,
    .modern-home .research-subentry {
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .modern-home .item-links,
    .modern-home .subentry-links {
      flex-direction: row;
      flex-wrap: wrap;
      padding-top: 4px;
    }
  }

  @media (max-width: 640px) {
    .modern-wrap {
      width: min(100% - 30px, var(--modern-content-width));
    }

    .modern-nav {
      display: block;
      min-height: 0;
      padding: 14px 0;
    }

    .modern-links {
      flex-wrap: wrap;
      justify-content: space-between;
      column-gap: clamp(4px, 1vw, 8px);
      row-gap: 2px;
      font-size: 16px;
      margin-top: 8px;
      padding-bottom: 2px;
      white-space: nowrap;
    }

    .modern-site-header .modern-links a {
      min-height: 36px;
      padding: 5px 0;
    }

    .modern-site-header .modern-links a[data-section="home"] {
      display: none;
    }

    .modern-home .quick-links {
      flex-wrap: nowrap;
      justify-content: space-between;
      column-gap: 0;
    }

    .modern-home .quick-links .quiet-link {
      min-height: 36px;
      padding: 5px 0;
      font-size: 1rem;
      white-space: nowrap;
    }

    .modern-home .hero {
      padding: 42px 0 56px;
    }

    .modern-home .hero h1 {
      font-size: 48px;
    }

    .modern-home .section {
      padding: 62px 0;
    }

    .modern-home .section-head h2 {
      font-size: 34px;
    }

    .modern-home .research-item,
    .modern-home .publication-entry {
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .modern-home .research-thumb {
      width: 100%;
      max-width: 275px;
    }

    .modern-home .publication-entry img {
      max-width: 230px;
    }

    .modern-home .research-copy h3 {
      font-size: 26px;
    }

    .modern-home .news-item {
      grid-template-columns: 1fr;
      gap: 3px;
    }

    .modern-footer-inner {
      display: block;
    }
  }
</style>
